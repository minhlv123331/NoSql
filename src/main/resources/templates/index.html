<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cửa Hàng Giày SneakPeak</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">👟 SNEAKPEAK STORE </a>
        </div>
    </nav>

    <div class="container">
        <!-- Form thêm nhanh sản phẩm -->
        <div class="card p-4 mb-4 shadow-sm">
            <h5 class="mb-3">Thêm Giày Mới Vào MongoDB</h5>
            <form th:action="@{/add-shoe}" th:object="${newShoe}" method="post" class="row g-3">
                <div class="col-md-3">
                    <input type="text" th:field="*{name}" class="form-control" placeholder="Tên giày (VD: Jordan 1)" required>
                </div>
                <div class="col-md-2">
                    <input type="text" th:field="*{brand}" class="form-control" placeholder="Hãng (VD: Nike)" required>
                </div>
                <div class="col-md-2">
                    <input type="number" th:field="*{price}" class="form-control" placeholder="Giá (VNĐ)" required>
                </div>
                <div class="col-md-3">
                    <input type="text" th:field="*{imageUrl}" class="form-control" placeholder="Link ảnh URL" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">+ Thêm Giày</button>
                </div>
            </form>
        </div>

        <!-- Danh sách sản phẩm lấy từ MongoDB -->
        <h4 class="mb-3">Danh Sách Sản Phẩm Hiện Có</h4>
        <div class="row">
            <div class="col-md-4 mb-4" th:each="shoe : ${shoes}">
                <div class="card h-100 shadow-sm">
                    <img th:src="${shoe.imageUrl}" class="card-img-top" alt="Shoe Image" style="height: 250px; object-fit: cover;">
                    <div class="card-body">
                        <span class="badge bg-secondary mb-2" th:text="${shoe.brand}">Brand</span>
                        <h5 class="card-title" th:text="${shoe.name}">Tên giày</h5>
                        <p class="card-text text-danger fw-bold fs-5" 
                           th:text="${#numbers.formatDecimal(shoe.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">Giá</p>
                        <p class="text-muted small">Size có sẵn: <span th:text="${shoe.sizes}"></span></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
