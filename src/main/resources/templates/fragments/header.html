<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">SNEAKPEAK - Premium Shoe Store</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .navbar-brand {
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .shoe-card {
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            transition: all 0.25s ease-in-out;
            background: #ffffff;
            overflow: hidden;
        }
        .shoe-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.12);
            border-color: #cbd5e1;
        }
        .shoe-card img {
            height: 240px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .shoe-card:hover img {
            transform: scale(1.03);
        }
        .size-badge {
            font-size: 0.75rem;
            padding: 3px 7px;
            border-radius: 6px;
            background-color: #f1f5f9;
            color: #334155;
            border: 1px solid #e2e8f0;
        }
        .filter-card {
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            background: #ffffff;
        }
        .hero-banner {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            border-radius: 16px;
            padding: 40px 30px;
            margin-bottom: 30px;
        }
        .auth-card {
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            background: #ffffff;
        }
    </style>
</head>

<body>
    <!-- Navbar Fragment -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
                <i class="bi bi-box-seam-fill text-warning fs-4"></i>
                <span class="fs-4">SNEAK<span class="text-warning">PEAK</span></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/}"><i class="bi bi-house-door me-1"></i> Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/(category='Sneaker')}">Sneaker</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/(category='Running')}">Chạy bộ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/(category='Basketball')}">Bóng rổ</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-2">
                    <!-- Giỏ hàng -->
                    <a th:href="@{/cart}" class="btn btn-outline-light position-relative rounded-pill px-3 py-1 me-2">
                        <i class="bi bi-cart3 me-1"></i> Giỏ hàng
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                              th:text="${cartItemCount != null ? cartItemCount : 0}">
                            0
                        </span>
                    </a>

                    <!-- KHI CHƯA ĐĂNG NHẬP (Anonymous) -->
                    <div sec:authorize="!isAuthenticated()" class="d-flex gap-2">
                        <a th:href="@{/login}" class="btn btn-outline-light rounded-pill px-3 py-1">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
                        </a>
                        <a th:href="@{/register}" class="btn btn-warning rounded-pill px-3 py-1 fw-semibold text-dark">
                            <i class="bi bi-person-plus me-1"></i> Đăng ký
                        </a>
                    </div>

                    <!-- KHI ĐÃ ĐĂNG NHẬP (Authenticated) -->
                    <div sec:authorize="isAuthenticated()" class="dropdown">
                        <button class="btn btn-secondary dropdown-toggle rounded-pill px-3 py-1 d-flex align-items-center gap-2" 
                                type="button" id="userMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle fs-5 text-warning"></i>
                            <span class="small fw-semibold" sec:authentication="name">User</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 rounded-3 mt-2" aria-labelledby="userMenuButton">
                            <li class="dropdown-header small text-muted">
                                Đã đăng nhập: <strong sec:authentication="name"></strong>
                            </li>
                            <!-- Chỉ hiển thị link Admin khi có ROLE_ADMIN -->
                            <li sec:authorize="hasRole('ADMIN')">
                                <a class="dropdown-item py-2 text-danger fw-semibold" th:href="@{/admin}">
                                    <i class="bi bi-speedometer2 me-2"></i> Trang Quản Trị (Admin)
                                </a>
                            </li>
                            <li sec:authorize="hasRole('ADMIN')"><hr class="dropdown-divider"></li>
                            <li>
                                <a class="dropdown-item py-2" th:href="@{/orders}">
                                    <i class="bi bi-bag-check me-2 text-primary"></i> Đơn hàng của tôi
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item py-2" th:href="@{/profile}">
                                    <i class="bi bi-person-gear me-2 text-secondary"></i> Thông tin tài khoản
                                </a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <!-- Form POST Logout kèm CSRF Token của Thymeleaf -->
                                <form th:action="@{/logout}" method="post" class="px-2 py-1">
                                    <button type="submit" class="dropdown-item rounded-2 text-danger py-2">
                                        <i class="bi bi-box-arrow-right me-2"></i> Đăng xuất
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>

                </div>
            </div>
        </div>
    </nav>
</body>
</html>
