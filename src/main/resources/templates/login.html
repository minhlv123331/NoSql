<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Đăng Nhập - SneakPeak')}">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Navbar -->
    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 col-xl-4">
                <div class="auth-card p-4 p-sm-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-box-seam-fill text-warning display-5"></i>
                        <h3 class="fw-bold mt-2">Đăng Nhập</h3>
                        <p class="text-muted small">Chào mừng bạn trở lại với SneakPeak Store</p>
                    </div>

                    <!-- Thông báo lỗi khi đăng nhập thất bại -->
                    <div th:if="${param.error != null or errorMessage != null}" class="alert alert-danger py-2 small d-flex align-items-center mb-3" role="alert">
                        <i class="bi bi-exclamation-circle-fill me-2 fs-5"></i>
                        <span th:text="${errorMessage != null ? errorMessage : 'Email hoặc mật khẩu không đúng!'}"></span>
                    </div>

                    <!-- Thông báo khi vừa đăng xuất hoặc vừa đăng ký -->
                    <div th:if="${param.logout != null or (param.registered != null and param.registered[0] == 'true') or successMessage != null}" 
                         class="alert alert-success py-2 small d-flex align-items-center mb-3" role="alert">
                        <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                        <span th:text="${successMessage != null ? successMessage : (param.registered != null ? 'Đăng ký thành công! Mời bạn đăng nhập.' : 'Đăng xuất tài khoản thành công!')}"></span>
                    </div>

                    <!-- Form Đăng Nhập -->
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">Địa chỉ Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" name="email" class="form-control border-start-0" 
                                       placeholder="name@example.com" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label small fw-bold text-secondary mb-0">Mật khẩu</label>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" name="password" class="form-control border-start-0" 
                                       placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-warning w-100 py-2 fw-bold text-dark rounded-3 shadow-sm mb-3">
                            <i class="bi bi-box-arrow-in-right me-1"></i> ĐĂNG NHẬP
                        </button>

                        <div class="text-center small text-muted">
                            Chưa có tài khoản? 
                            <a th:href="@{/register}" class="fw-semibold text-decoration-none text-primary">Đăng ký ngay</a>
                        </div>
                    </form>

                    <!-- Khối thông tin tài khoản mẫu test nhanh -->
                    <div class="mt-4 pt-3 border-top text-secondary small bg-light p-3 rounded-3">
                        <div class="fw-bold mb-1 text-dark"><i class="bi bi-key-fill text-warning me-1"></i> Tài khoản mẫu dùng thử:</div>
                        <div class="mb-1"><strong>Admin:</strong> <code>admin@gmail.com</code> / <code>123456</code></div>
                        <div><strong>Khách:</strong> <code>user@gmail.com</code> / <code>123456</code></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
